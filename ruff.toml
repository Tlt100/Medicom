line-length = 140
target-version = "py312"
src = ["backend"]

[lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
# typing.List/Optional style is kept for consistency across the codebase.
ignore = ["UP006", "UP007", "UP035", "UP045"]

[lint.per-file-ignores]
"backend/tests/*" = ["S101"]
# Verbatim legal excerpts are kept on one line so they can be compared with the source.
"backend/patientshield/core/sources/registry.py" = ["E501"]
